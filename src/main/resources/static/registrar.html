<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <link rel="stylesheet" href="/css/registrar.css">
</head>
<body>
<div class="login-box">
    <h2>Registro</h2>
    <form id="RegistroForm">
        <div class="input-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Introduce el nombre" required>
        </div>
        <div class="input-group">
            <label for="apellidos">Apellidos</label>
            <input type="text" id="apellidos" placeholder="Introduce los apellidos" required>
        </div>
        <div class="input-group">
            <label for="institucion">Intitucion</label>
            <input type="text" id="institucion" placeholder="Introduce la institución a la que perteneces" required>
        </div>
        <div class="input-group">
            <label for="correo">Correo</label>
            <input type="email" id="correo" placeholder="Introduce el correo" required>
        </div>
        <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Introduce tu contraseña" required>
        </div>

        <div class="buttons">
            <button type="reset" class="clear-btn">Borrar</button>
            <button type="submit" class="login-btn">Registrarse</button>
        </div>
        <p class="login">Ya tienes cuenta. <a href="login.html">login</a></p>
    </form>
    <p id="loginMessage" style="text-align: center; color: red;"></p>
</div>
</body>
<script>
    document.getElementById('RegistroForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const nombre = document.getElementById('nombre').value;
        const apellidos = document.getElementById('apellidos').value;
        const institucion = document.getElementById('institucion').value;
        const correo = document.getElementById('correo').value;
        const password = document.getElementById('password').value;
        try {
            console.log('Enviando datos:', { nombre, apellidos, institucion, correo, password });
            const response = await fetch('/api/investigador/registrar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `nombre=${encodeURIComponent(nombre)}&apellidos=${encodeURIComponent(apellidos)}&institucion=${encodeURIComponent(institucion)}&password=${encodeURIComponent(password)}&correo=${encodeURIComponent(correo)}`
            });

            if (response.ok) {
                loginMessage.style.color = 'green';
                loginMessage.textContent = 'cargando ...';
                const json = await response.json();
                if (!json.success) throw new Error("API indicó error");

                localStorage.setItem('token', json.token);
                console.log("Token guardado en localStorage:", json.token);

                setTimeout(() => {
                    const token = localStorage.getItem('token');
                    window.location.href = `/informes.html?token=${token}`;
                }, 1000);
            } else {
                const errorText = await response.text();
                loginMessage.textContent = errorText || 'registro fallido intentalo más tarde';
            }
        } catch (e) {
            console.error('Error:', e);
            loginMessage.textContent = 'Se ha producido un error durante el login';
        }

    });
</script>
</html>
