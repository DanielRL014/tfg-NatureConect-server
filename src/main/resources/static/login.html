<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
<div class="login-box">
    <h2>Login</h2>
    <form id="loginForm">
        <div class="input-group">
            <label for="correo">Correo</label>
            <input type="text" id="correo" placeholder="Introduce el correo" required>
        </div>
        <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Introduce tu contraseña" required>
        </div>

        <div class="buttons">
            <button type="reset" class="clear-btn">Borrar</button>
            <button type="submit" class="login-btn">Iniciar sesion</button>
        </div>
        <p class="signup-text">Registrarte. <a href="registrar.html">Sign Up</a></p>
    </form>
    <p id="loginMessage" style="text-align: center; color: red;"></p>
</div>
</body>
<script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const correo = document.getElementById('correo').value;
        const password = document.getElementById('password').value;
        try {
            const response = await fetch('/api/investigador/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `correo=${encodeURIComponent(correo)}&password=${encodeURIComponent(password)}`
            });
            if (response.ok) {
                loginMessage.style.color = 'green';
                loginMessage.textContent = 'cargando ...';
                const json = await response.json();
                if (!json.success) throw new Error("API indicó error");


                localStorage.setItem('token',  json.token);
                console.log("Token guardado en localStorage:", json.token);

                setTimeout(() => {
                    const token = localStorage.getItem('token');
                    window.location.href = `/informes.html?token=${token}`;
                }, 1000);
            } else {
                const errorText = await response.text();
                loginMessage.textContent = errorText || 'inicio se sesion fallido rebisa las credeciales';
            }
        } catch (e) {
            console.error('Error:', e);
            loginMessage.textContent = 'Se ha producido un error durante el login';
        }

    });
</script>
</html>
